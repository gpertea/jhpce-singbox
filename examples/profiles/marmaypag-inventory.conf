# Example profile: crawl R objects under /dcs04/lieber/marmaypag and write an
# inventory into /dcs04/lieber/marmaypag/data-inventory.
#
# Install:  mkdir -p ~/.config/ai-singbox/profiles
#           cp $AI_SINGBOX_ROOT/examples/profiles/marmaypag-inventory.conf ~/.config/ai-singbox/profiles/
# Before the first run, create the output folder on the host (the sandbox never
# creates writable folders):  mkdir -p /dcs04/lieber/marmaypag/data-inventory
# Use:      ai-singbox --profile marmaypag-inventory --agent claude

description = R-object inventory of /dcs04/lieber/marmaypag

# ---- read-only data folders ------------------------------------------------------
# Everything the default profile lists (/dcs04/lieber, /dcs05/lieber, /dcs07/lieber):
include = default
# Add more with 'read = /path' lines.

# ---- writable folders ----------------------------------------------------------------
write = /dcs04/lieber/marmaypag/data-inventory

# ---- session home --------------------------------------------------------------------
# A home of its own for this project (own ~/.bashrc, own agent logins). Leave this
# line out to share the standard home ~/.ai-singbox/home with other sessions.
# home = ~/.ai-singbox/homes/marmaypag-inventory

# ---- software ------------------------------------------------------------------------
module = conda_R/4.5.x
