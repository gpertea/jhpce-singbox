# Example profile: crawl R objects under /dcs04/lieber/marmaypag and write an
# inventory into /dcs04/lieber/marmaypag/data-inventory.
#
# Install:  cp examples/profiles/marmaypag-inventory.conf ~/.config/libd-ai-sandbox/profiles/
# Before the first run, create the output folder on the host (the wrapper never
# creates writable folders):  mkdir -p /dcs04/lieber/marmaypag/data-inventory
# Use:      libd-ai-sandbox --profile marmaypag-inventory --agent claude
#
# /dcs04/lieber is already mounted read-only by the site mounts file, so the lab
# folder needs no 'read' line. Only data-inventory becomes writable.

description = R-object inventory of /dcs04/lieber/marmaypag
module = conda_R/4.5.x
write = /dcs04/lieber/marmaypag/data-inventory
