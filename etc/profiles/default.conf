# Site profile 'default': used when libd-ai-sandbox is started without --profile.
#
# To change it for yourself, copy it and edit the copy (your copy replaces this one):
#   mkdir -p ~/.config/libd-ai-sandbox/profiles
#   cp $LIBD_AI_SANDBOX_ROOT/etc/profiles/default.conf ~/.config/libd-ai-sandbox/profiles/
# Other profiles can build on it with:  include = default

description = LIBD storage, read-only

# ---- read-only data folders ------------------------------------------------------
# Visible inside at the same path, never writable. Name a mounted export such as
# /dcs04/lieber, not a storage root such as /dcs04. Folders missing on a node are
# skipped with a warning.
read = /dcs04/lieber
read = /dcs05/lieber
read = /dcs07/lieber

# ---- writable folders ----------------------------------------------------------------
# None by default. Add 'write = /existing/folder' lines in your own profiles.
# $MYSCRATCH, the session home and /tmp are always writable.

# ---- session home --------------------------------------------------------------------
# Where $HOME (with its ~/.bashrc) lives on the host. Default: ~/.libd-ai-sandbox/home
# home = ~/.libd-ai-sandbox/home
