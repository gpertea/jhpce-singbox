# Site profile 'default': used when ai-singbox is started without --profile.
#
# To change it for yourself, copy it and edit the copy (your copy replaces this one):
#   mkdir -p ~/.config/ai-singbox/profiles
#   cp $AI_SINGBOX_ROOT/etc/profiles/default.conf ~/.config/ai-singbox/profiles/
# Other profiles can build on it with:  include = default

description = standard session: LIBD storage read-only

# ---- read-only data folders ------------------------------------------------------
# This installation shows the LIBD storage (see profile 'libd'). Another group's
# installation would include its own storage profile here instead.
include = libd
# More folders: read = /path

# ---- writable folders ----------------------------------------------------------------
# None by default. Add 'write = /existing/folder' lines in your own profiles.
# $MYSCRATCH, the session home and /tmp are always writable.

# ---- session home --------------------------------------------------------------------
# Where $HOME (with its ~/.bashrc) lives on the host. Default: ~/.ai-singbox/home
# home = ~/.ai-singbox/home
