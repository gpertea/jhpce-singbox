# Site profile 'libd': the Lieber Institute (LIBD) storage on JHPCE, read-only.
# Included by the 'default' profile of this installation. Other groups add a profile
# like this one for their own storage and include it from 'default'.

description = LIBD storage on JHPCE, read-only

# ---- read-only data folders ------------------------------------------------------
# Visible inside at the same path, never writable. Name a mounted export such as
# /dcs04/lieber, not a storage root such as /dcs04. Folders missing on a node are
# skipped with a warning.
read = /dcs04/lieber
read = /dcs05/lieber
read = /dcs07/lieber
